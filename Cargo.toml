[package]
name = "db-bridge"
version = "0.1.1"
edition = "2024"
description = "Inspector SQLite de escritorio para apps offline-first: archivo local, simulador iOS y emulador Android"

[dependencies]
anyhow = "1"
dirs = "7"
eframe = "0.37"
rfd = "0.18"
rusqlite = { version = "0.42", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
