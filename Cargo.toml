[package]
name = "db-bridge"
version = "0.1.2"
edition = "2024"
description = "Inspector SQLite de escritorio para apps offline-first: archivo local, simulador iOS y emulador Android"

[dependencies]
anyhow = "1"
dirs = "7"
eframe = "0.37"
flate2 = "1"
rfd = "0.18"
rusqlite = { version = "0.42", features = ["bundled"] }
self-replace = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
ureq = { version = "3", features = ["json"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
