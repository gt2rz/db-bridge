name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Los avisos de RustSec aparecen sin que cambie el código: la auditoría se repite cada lunes.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Sin permisos por defecto: cada job pide solo lo que necesita.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # En una PR, un push nuevo deja obsoleta la ejecución anterior; en main cada commit conserva
  # su resultado.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Las actions van fijadas por SHA (con su versión en el comentario) para que una etiqueta
# reescrita no pueda cambiar el código que se ejecuta. Dependabot las mantiene al día.

jobs:
  changes:
    name: Cambios
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Si solo cambia documentación no hace falta compilar. Ante cualquier duda (ejecución
      # programada o manual, rama nueva, base desconocida) se comprueba todo.
      - name: ¿Cambia algo más que documentación?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="HEAD^1" ;; # el checkout de una PR es su merge sobre la base
            push) base="$BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            code=true
          elif git diff --name-only "$base" HEAD | grep -qvE '^docs/|\.md$'; then
            code=true
          else
            code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  fmt:
    name: Formato
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml fija el canal estable con rustfmt y clippy; rustup lo instala solo.
      - run: cargo fmt --check

  check:
    name: Comprobar (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  audit:
    name: Auditoría de dependencias
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vulnerabilidades (RustSec), crates retirados y orígenes permitidos: ver deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans sources

  # Único check obligatorio del ruleset de main: resume los demás, así que cambiar la matriz o
  # saltarse la compilación en una PR de documentación no exige tocar el ruleset.
  ci:
    name: CI
    needs: [changes, fmt, check, audit]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Resultado
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
