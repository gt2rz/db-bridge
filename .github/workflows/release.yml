name: Release

# Cada push a main actualiza la PR de versión de release-please (a partir de los commits
# feat:/fix:). Al fusionarla se crea la etiqueta vX.Y.Z y la Release, y se compilan y suben los
# binarios. Los nombres de los archivos no llevan la versión para que la landing pueda enlazar
# siempre a releases/latest/download/<archivo>.

on:
  push:
    branches: [main]

# Sin permisos por defecto: cada job pide solo lo que necesita.
permissions: {}

# Nunca dos publicaciones a la vez; la que está en marcha no se cancela.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Versión
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Con la GitHub App de releases (docs/github.md) la PR de versión la abre la App: el CI se
      # ejecuta sobre ella y puedes aprobarla tú. Sin la App se usa el token del workflow, que
      # no dispara el CI en la PR.
      - name: Token de la GitHub App de releases
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Compilar (${{ matrix.platform }})
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            asset: DB-Bridge-macOS-universal.dmg
          - platform: linux
            os: ubuntu-22.04
            asset: db-bridge-linux-x86_64.tar.gz
          - platform: windows
            os: windows-latest
            asset: db-bridge-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # subir los binarios a la Release
      id-token: write # firmar la atestación de procedencia (Sigstore)
      attestations: write
    timeout-minutes: 45
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-${{ matrix.platform }}

      - name: Compilar y empaquetar (macOS universal)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          # Una sola invocación compila las dos arquitecturas en paralelo.
          cargo build --release --locked --target aarch64-apple-darwin --target x86_64-apple-darwin

          app="dist/DB Bridge.app"
          mkdir -p "$app/Contents/MacOS"
          lipo -create -output "$app/Contents/MacOS/db-bridge" \
            target/aarch64-apple-darwin/release/db-bridge \
            target/x86_64-apple-darwin/release/db-bridge
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>DB Bridge</string>
            <key>CFBundleDisplayName</key><string>DB Bridge</string>
            <key>CFBundleIdentifier</key><string>dev.gt2rz.db-bridge</string>
            <key>CFBundleExecutable</key><string>db-bridge</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # Firma ad hoc: sin certificado de Apple, pero el bundle queda íntegro para Gatekeeper.
          codesign --force --deep --sign - "$app"

          mkdir -p dist/dmg
          cp -R "$app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "DB Bridge" -srcfolder dist/dmg -ov -format UDZO \
            dist/DB-Bridge-macOS-universal.dmg

          cd dist
          shasum -a 256 DB-Bridge-macOS-universal.dmg > DB-Bridge-macOS-universal.dmg.sha256

      - name: Compilar y empaquetar (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cargo build --release --locked
          mkdir -p dist/db-bridge
          cp target/release/db-bridge README.md dist/db-bridge/
          tar -C dist -czf dist/db-bridge-linux-x86_64.tar.gz db-bridge
          cd dist
          sha256sum db-bridge-linux-x86_64.tar.gz > db-bridge-linux-x86_64.tar.gz.sha256

      - name: Compilar y empaquetar (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cargo build --release --locked
          New-Item -ItemType Directory -Force dist/db-bridge | Out-Null
          Copy-Item target/release/db-bridge.exe, README.md dist/db-bridge/
          Compress-Archive -Path dist/db-bridge/* -DestinationPath dist/db-bridge-windows-x86_64.zip
          $hash = (Get-FileHash dist/db-bridge-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  db-bridge-windows-x86_64.zip" | Out-File -Encoding ascii dist/db-bridge-windows-x86_64.zip.sha256

      # Atestación firmada de que cada archivo salió de este workflow y de este commit.
      # Se verifica con: gh attestation verify <archivo> --repo gt2rz/db-bridge
      - name: Atestación de procedencia
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ matrix.asset }}

      - name: Subir a la Release
        shell: bash
        run: |
          shopt -s nullglob
          gh release upload "$TAG" dist/*.dmg dist/*.tar.gz dist/*.zip dist/*.sha256 --clobber

  landing:
    name: Avisar a la landing
    needs: [release-please, build]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    env:
      # Token opcional (fine-grained, permiso Contents: write sobre gt2rz/db-bridge-landing).
      # Sin él, la landing recoge la versión nueva en su compilación diaria.
      TOKEN: ${{ secrets.LANDING_DISPATCH_TOKEN }}
    steps:
      - name: Recompilar la landing
        if: env.TOKEN != ''
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gt2rz/db-bridge-landing/dispatches \
            -d '{"event_type":"release"}'
